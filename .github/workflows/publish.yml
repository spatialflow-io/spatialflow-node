name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1+; the npm bundled with Node 22 is older and publishes unauthenticated.
      - name: Upgrade npm
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm ci
      - name: Build
        run: npx tsup
      - name: Verify build
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          echo "Build artifacts verified"
      - name: Publish to npm
        run: npm publish --provenance --access public
        # Authenticates with OIDC, so no NPM_TOKEN. Needs the trusted publisher configured on
        # npmjs.com (package settings → Trusted Publisher) for this repository and publish.yml.
